name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=authlog_analyzer --cov-report=term-missing --cov-fail-under=90

  secrets-scan:
    name: gitleaks secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GITHUB_TOKEN is the token GitHub provides to every workflow run; there is
      # no secret to configure. A GITLEAKS_LICENSE secret is only required for
      # repositories owned by an organisation, not for a personal account.
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
